<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mock Interview - SSB Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <style>
        .video-box { border: 4px solid #1e3a8a; box-shadow: 0 0 30px rgba(30, 58, 138, 0.4); }
        .pulse-red { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        body { overflow-x: hidden; }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex flex-col">
    <header class="p-4 md:p-6 flex justify-between items-center border-b border-gray-800 shrink-0">
        <div class="flex items-center">
            <img src="imageout/ssb logo.png" alt="Logo" class="h-8 w-8 md:h-10 md:w-10 mr-3">
            <h1 class="text-lg md:text-xl font-bold text-blue-400 uppercase tracking-tight">AI Interview Panel</h1>
        </div>
        <a href="dashboard.html" class="bg-gray-800 hover:bg-gray-700 px-3 py-2 rounded-xl text-xs md:text-sm transition-all active:scale-95 flex items-center">
            <i class="fas fa-chevron-left mr-2"></i> Back to Dashboard
        </a>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4 md:p-8">
        <div class="w-full max-w-6xl grid lg:grid-cols-3 gap-6 md:gap-10 items-stretch">
            
            <div class="lg:col-span-1">
    <div class="bg-gray-800/60 p-8 rounded-3xl border border-gray-700 text-center shadow-2xl h-full flex flex-col items-center">
        
        <div class="relative inline-block mb-8">
            <img src="imageout/priyaai.png" 
                 alt="Capt. Priya Sharma" 
                 class="w-48 h-48 rounded-full border-4 border-blue-500 object-cover shadow-2xl mx-auto transition-transform duration-300 hover:scale-105 max-w-full">
            
            <span class="absolute bottom-3 right-3 w-6 h-6 bg-green-500 border-4 border-gray-800 rounded-full animate-pulse shadow-lg"></span>
        </div>
        
        <div class="mb-8">
            <h2 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Capt. Priya Sharma</h2>
            <p class="text-blue-400 font-bold text-sm uppercase tracking-widest mt-1">Interviewing Officer</p>
        </div>
        
        <div class="w-full bg-gray-900/80 rounded-2xl py-3 px-4 flex items-center justify-center border border-gray-700 mb-auto">
            <span id="statusDot" class="w-3 h-3 bg-red-600 rounded-full mr-3"></span>
            <span id="statusText" class="text-xs font-black uppercase tracking-widest text-gray-400">System Offline</span>
        </div>

        <button id="mainBtn" class="w-full mt-8 bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black text-lg transition-all shadow-2xl active:scale-95 uppercase tracking-widest">
            Start Session
        </button>
    </div>
</div>

            <div class="lg:col-span-2 flex flex-col space-y-6">
                <div class="video-box relative aspect-video bg-black rounded-3xl overflow-hidden group">
                    <video id="userCam" autoplay playsinline class="w-full h-full object-cover hidden"></video>
                    <div id="camPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-700 bg-gray-900">
                        <i class="fas fa-video-slash text-5xl mb-4"></i>
                        <p class="font-bold uppercase text-xs tracking-widest">Camera Inactive</p>
                    </div>
                    <div id="liveLabel" class="absolute top-4 right-4 bg-red-600 text-white text-[10px] font-black px-3 py-1 rounded-full hidden pulse-red tracking-tighter">
                        LIVE FEED
                    </div>
                </div>

                <div class="flex-1 bg-gray-800/40 p-6 md:p-10 rounded-3xl border border-gray-700 flex items-center justify-center shadow-lg">
                    <p id="questionDisplay" class="text-lg md:text-xl font-medium text-gray-500 text-center leading-relaxed italic">
                        "Ready to practice your Officer Like Qualities? Click the button in the profile panel to begin."
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const video = document.getElementById('userCam');
        const mainBtn = document.getElementById('mainBtn');
        const questionDisplay = document.getElementById('questionDisplay');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const placeholder = document.getElementById('camPlaceholder');
        const liveLabel = document.getElementById('liveLabel');

        const questions = [
            "Welcome. Tell me something about your hometown and your schooling.",
            "Why did you choose your current stream of education?",
            "What motivates you to pursue a career in the Indian Armed Forces?",
            "Describe a situation where you had to lead a team through a difficult task.",
            "How do you keep yourself physically and mentally fit for the SSB?"
        ];
        let qIndex = 0;

        mainBtn.onclick = async () => {
            if (qIndex === 0) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    video.srcObject = stream;
                    video.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    liveLabel.classList.remove('hidden');
                    statusDot.classList.replace('bg-red-600', 'bg-green-500');
                    statusText.innerText = "System Online";
                    statusText.classList.replace('text-gray-400', 'text-green-500');
                    mainBtn.innerText = "Next Question";
                    showNextQuestion();
                } catch (e) {
                    alert("Error: Please enable camera and microphone permissions to start.");
                }
            } else {
                showNextQuestion();
            }
        };

        function showNextQuestion() {
            if (qIndex < questions.length) {
                questionDisplay.innerText = questions[qIndex];
                questionDisplay.classList.replace('text-gray-500', 'text-white');
                qIndex++;
            } else {
                questionDisplay.innerText = "Excellent attempt. Review your posture and confidence in the recording. Jai Hind!";
                mainBtn.innerText = "Finish";
                mainBtn.classList.replace('bg-blue-600', 'bg-green-600');
                mainBtn.onclick = () => window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
